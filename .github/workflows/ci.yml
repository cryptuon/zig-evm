name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Pinned to 0.14.1: build.zig uses the 0.14 build-system API
  # (`b.addExecutable(.{ .root_module = b.createModule(...) })`, `b.addLibrary`,
  # `b.addTest(.{ .root_module = ... })`). On 0.13.0 every job fails with
  #   build.zig:9:10: error: no field named 'root_module' in struct 'Build.ExecutableOptions'
  ZIG_VERSION: "0.14.1"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            zig_target: x86_64-linux
          - os: macos-latest
            zig_target: aarch64-macos
          - os: windows-latest
            zig_target: x86_64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run Tests
        run: zig build test

      - name: Run Compliance Tests
        run: zig build compliance

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseFast, ReleaseSmall]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Executable
        run: zig build run -Doptimize=${{ matrix.optimize }}

      - name: Build Libraries
        run: zig build lib -Doptimize=${{ matrix.optimize }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigevm-${{ matrix.os }}-${{ matrix.optimize }}
          path: |
            zig-out/lib/*
            zig-out/include/*

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run Benchmarks
        run: zig build benchmark -Doptimize=ReleaseFast

      - name: Run Parallel Demo
        run: zig build parallel-opt -Doptimize=ReleaseFast

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Library
        run: zig build lib -Doptimize=ReleaseFast

      - name: Install Python Dependencies
        run: |
          cd bindings/python
          pip install -e .
          pip install pytest

      - name: Run Python Tests
        run: |
          cd bindings/python
          python -c "from zigevm import EVM; print('Import successful')"

  rust-bindings:
    name: Rust Bindings
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Library
        run: zig build lib -Doptimize=ReleaseFast

      - name: Build Rust Bindings
        run: |
          cd bindings/rust/zigevm
          cargo build --release

      - name: Run Rust Tests
        run: |
          cd bindings/rust/zigevm
          cargo test --release

  js-bindings:
    name: JavaScript Bindings
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Library
        run: zig build lib -Doptimize=ReleaseFast

      - name: Install Dependencies
        run: |
          cd bindings/js
          npm install

      - name: Build Bindings
        run: |
          cd bindings/js
          npm run build || true

      - name: Run Tests
        run: |
          cd bindings/js
          npm test || true

  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - aarch64-linux
          - x86_64-linux-musl
          - aarch64-macos
          - x86_64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cross Compile
        run: zig build lib -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Upload Cross-Compiled Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigevm-${{ matrix.target }}
          path: |
            zig-out/lib/*
            zig-out/include/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build, cross-compile]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            tar -czvf "${name}.tar.gz" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
