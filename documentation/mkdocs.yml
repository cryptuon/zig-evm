site_name: Zig EVM Documentation
site_description: High-performance, embeddable Ethereum Virtual Machine implementation in Zig
site_url: https://docs.cryptuon.com/zig-evm/
site_author: Cryptuon Research
repo_url: https://github.com/cryptuon/zig-evm
repo_name: cryptuon/zig-evm
edit_uri: edit/main/documentation/docs/
copyright: "© 2026 Cryptuon Research"

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  homepage: https://zig-evm.cryptuon.com/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cryptuon/zig-evm

nav:
  - Home: index.md
  - Docs:
      - Getting Started:
          - Installation: getting-started/installation.md
          - Quick Start: getting-started/quickstart.md
          - Basic Usage: getting-started/basic-usage.md
      - User Guide:
          - Architecture: user-guide/architecture.md
          - Opcodes: user-guide/opcodes.md
          - Gas Metering: user-guide/gas-metering.md
          - Parallel Execution: user-guide/parallel-execution.md
  - API Reference:
      - Zig API: api-reference/zig-api.md
      - C FFI: api-reference/c-ffi.md
      - Python: api-reference/python.md
      - Rust: api-reference/rust.md
      - JavaScript: api-reference/javascript.md
  - Project:
      - EVM Fundamentals: advanced/evm-fundamentals.md
      - Performance Tuning: advanced/performance.md
      - Contributing: advanced/contributing.md
